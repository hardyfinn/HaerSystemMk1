# Builds the plugin for Apple Silicon Macs.
# Pushes to main publish the .vcvplugin on the "latest" release page.
# Pushes to work branches publish it on the "preview" release page.
name: Build plugin

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

permissions:
  contents: write

env:
  RACK_SDK_VERSION: 2.6.4

jobs:
  build-mac-arm64:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: brew list zstd >/dev/null 2>&1 || brew install zstd
      - name: Download Rack SDK
        run: |
          curl -fsSL -o sdk.zip "https://vcvrack.com/downloads/Rack-SDK-${RACK_SDK_VERSION}-mac-arm64.zip"
          unzip -q sdk.zip -d "$RUNNER_TEMP"
      - name: Unit tests
        run: make test
      - name: Build
        run: |
          make dist RACK_DIR="$RUNNER_TEMP/Rack-SDK" -j3 2>&1 | tee build.log
          if grep -q "warning:" build.log; then echo "Compiler warnings found (the spec asks for none)"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: Codex-mac-arm64
          path: dist/*.vcvplugin
      - name: Publish to the "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --target "$GITHUB_SHA" --title "Latest build" --notes "Built automatically from main."
          gh release upload latest dist/*.vcvplugin --clobber
      - name: Publish branch builds to the "preview" release
        if: github.ref != 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view preview >/dev/null 2>&1 || gh release create preview --prerelease --target "$GITHUB_SHA" --title "Preview build" --notes "Built from a work branch, for trying a milestone before it is merged."
          gh release upload preview dist/*.vcvplugin --clobber
